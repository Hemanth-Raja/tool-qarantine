# Tool Quarantine — single-VM deployment for the Vultr demo.
#   docker compose -f deploy/docker-compose.yml up --build
# The app container drives the host Docker daemon to build disposable sandboxes.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    expose:
      - "8000"                                    # reached only through caddy
    environment:
      - VULTR_API_KEY=${VULTR_API_KEY:-}          # unset -> deterministic mock agent
      - VULTR_INFERENCE_BASE=https://api.vultrinference.com/v1
      - VULTR_MODEL=${VULTR_MODEL:-qwen3.8-27b}
      # Sandbox bind mounts are resolved by the host daemon, so per-run dirs live in a
      # dir mounted at the same path on host and in this container.
      - TMPDIR=/tmp/tq
      - TQ_STAGE_TOOL=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # to manage sandbox containers
      - /tmp/tq:/tmp/tq
      - tqdata:/data
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TQ_SITE=${TQ_SITE:-:80}                   # public hostname -> automatic HTTPS; default plain HTTP
      - TQ_PUBLIC_IP=${TQ_PUBLIC_IP:-tq-no-ip.invalid}  # bare-IP links redirect to TQ_SITE
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data                           # certificates survive restarts
    depends_on:
      - app
    restart: unless-stopped
volumes:
  tqdata:
  caddydata:
