<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registry · Tool Quarantine</title><link rel="stylesheet" href="/static/app.css"></head>
<body data-nav="registry" data-title="Tool registry" data-sub="Every tool version a reviewer or policy approved or blocked, pinned by the sha256 of its code.">
<main id="page">
<div class="kpis" id="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
  <div class="kpi good"><div class="l">Approved versions</div><div class="v" id="k-ap">–</div><div class="s">agents may launch these, byte-for-byte</div></div>
  <div class="kpi alert"><div class="l">Blocked versions</div><div class="v" id="k-bl">–</div><div class="s">refused at every registry check</div></div>
  <div class="kpi"><div class="l">Expired approvals</div><div class="v" id="k-ex">–</div><div class="s" id="k-ttl">&nbsp;</div></div>
</div>
<div class="card">
  <div class="cardhead"><h2>Versions</h2><span class="sp"></span><div class="chips" id="filters"></div>
    <input id="q" placeholder="Search tools or hashes…" style="width:210px;padding:6px 10px"></div>
  <div style="overflow-x:auto"><table><thead><tr><th>Tool</th><th>State</th><th>Fingerprint</th><th>Quarantine verdict</th><th>Last change</th><th>When</th></tr></thead>
  <tbody id="reg"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody></table></div>
</div>
<div class="card">
  <h2>Check a fingerprint</h2>
  <p class="sub">The same call an agent or MCP gateway makes before it launches a tool.</p>
  <div class="row"><input id="hash" placeholder="sha256 of the tool's code" style="flex:1;min-width:240px;font-family:var(--mono)">
    <button id="check">Check</button></div>
  <pre class="code hide" id="checkout" style="margin-top:10px"></pre>
</div>
</main>
<script src="/static/shell.js"></script>
<script>
const $=id=>document.getElementById(id);
let REG=[], F='all', TTL=0;
const exp=e=>e.state==='approved'&&TTL&&(Date.now()/1000-e.at)>TTL*86400;
const st=e=>exp(e)?'expired':e.state;
function render(){
  const q=$('q').value.trim().toLowerCase();
  const n=k=>k==='all'?REG.length:REG.filter(e=>st(e)===k).length;
  $('filters').innerHTML=[['all','All'],['approved','Approved'],['blocked','Blocked'],['expired','Expired']].map(([k,l])=>
    `<button class="chip ${k===F?'on':''}" onclick="F='${k}';render()">${l} <span class=dim>${n(k)}</span></button>`).join('');
  const rs=REG.filter(e=>(F==='all'||st(e)===F)&&(!q||(e.tool+' '+e.hash).toLowerCase().includes(q)));
  $('reg').innerHTML=rs.length?rs.map(e=>`<tr class=click onclick="location.href='/run/${e.run_id}'">
    <td><span class=mono>${esc(e.tool)}</span><div class=dim style="font-size:12px">${esc(e.source||'')}</div></td>
    <td><span class="badge b-${st(e)}">${{approved:'✓ approved',blocked:'⛔ blocked',expired:'⏱ expired'}[st(e)]}</span></td>
    <td><code title="${esc(e.hash)}">sha256:${esc(e.hash.slice(0,12))}</code>
      <button class="ghost" style="padding:2px 8px;font-size:11.5px;margin-left:4px" onclick="event.stopPropagation();copyText('${e.hash}','Fingerprint copied')">copy</button></td>
    <td>${e.verdict?`<span class="badge b-${e.verdict}">${e.verdict}</span> <span class=score>${e.score}</span>`:'—'}</td>
    <td class=muted>${esc(e.action||'')}${e.reviewer?' by '+esc(e.reviewer):''}${e.note?`<div class=dim style="font-size:12.5px">“${esc(e.note)}”</div>`:''}
      ${(e.history||[]).length>1?`<div class=dim style="font-size:12px">${e.history.length} decisions in history</div>`:''}</td>
    <td class=dim>${ago(e.at)}</td></tr>`).join('')
    :`<tr><td colspan=6 class=empty>${REG.length?'Nothing matches.':'Nothing approved or blocked yet. Open a scan and decide, or let a policy do it.'}</td></tr>`;
}
async function load(){
  const [reg,pol]=await Promise.all([getJSON('/api/registry'),getJSON('/api/policies')]);
  REG=reg; TTL=pol.approval_ttl_days||0;
  $('k-ap').textContent=REG.filter(e=>st(e)==='approved').length;
  $('k-bl').textContent=REG.filter(e=>e.state==='blocked').length;
  $('k-ex').textContent=REG.filter(exp).length;
  $('k-ttl').innerHTML=TTL?`approvals last ${TTL} days`:`approvals never expire · <a href="/app/policies">set a limit</a>`;
  render();
}
$('q').oninput=render;
$('check').onclick=async()=>{const h=$('hash').value.trim();if(!h)return;
  const j=await getJSON('/api/registry/check?hash='+encodeURIComponent(h));
  $('checkout').textContent=`$ curl ${location.origin}/api/registry/check?hash=${h.slice(0,16)}…\n`+JSON.stringify(j,null,2);$('checkout').classList.remove('hide')};
load();
</script></body></html>
